name: Stale

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: "Days of inactivity before an issue/PR is marked stale."
        type: number
        required: false
        default: 60
      days-before-close:
        description: "Days after being marked stale before an issue/PR is closed."
        type: number
        required: false
        default: 14
      exempt-labels:
        description: "Comma-separated labels that exempt an issue/PR from going stale."
        type: string
        required: false
        default: "pinned,security,blocked,roadmap"
      operations-per-run:
        description: "Max GitHub API operations per run."
        type: number
        required: false
        default: 100
      dry-run:
        description: "Log what would happen without applying labels or closing anything."
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: [self-hosted, Linux, ttt]
    steps:
      - name: Mark and close stale issues and PRs
        uses: actions/stale@v10.4.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          operations-per-run: ${{ inputs.operations-per-run }}
          debug-only: ${{ inputs.dry-run }}

          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: ${{ inputs.exempt-labels }}
          exempt-pr-labels: ${{ inputs.exempt-labels }}

          stale-issue-message: >
            This issue has had no activity for ${{ inputs.days-before-stale }} days and has been
            marked stale. Comment or remove the `stale` label to keep it open, otherwise it will
            be closed in ${{ inputs.days-before-close }} days.
          stale-pr-message: >
            This pull request has had no activity for ${{ inputs.days-before-stale }} days and has
            been marked stale. Push a commit or comment to keep it open, otherwise it will be
            closed in ${{ inputs.days-before-close }} days.
          close-issue-message: >
            Closing as stale after ${{ inputs.days-before-close }} days with no further activity.
            Reopen if this is still relevant.
          close-pr-message: >
            Closing as stale after ${{ inputs.days-before-close }} days with no further activity.
            Reopen if you intend to continue this work.

          close-issue-reason: not_planned
          # Never touch branches — closing a stale PR must not delete anyone's work.
          delete-branch: false
          # Drafts are work-in-progress, not abandoned.
          exempt-draft-pr: true
          # Oldest first, so a capped run always makes progress on the true backlog.
          ascending: true
          enable-statistics: true
